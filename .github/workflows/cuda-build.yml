name: cuda-build

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cuda-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        # cuda: [ '12.5.0', '12.1.0', '11.5.0', '11.0.1' ]
        cuda: [ '12.6.0', '12.5.0' ]

    name: cuda build ${{ matrix.cuda }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: jimver/cuda-toolkit@v0.2.19
      id: cuda-toolkit
      with:
        cuda: ${{ matrix.cuda }}
        method: 'network'
        sub-packages: '[ "nvcc" ]'

    - name: check NVCC
      run: nvcc -V

    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Get cmake
      uses: lukka/get-cmake@latest

    - name: build
      run:
        mkdir build;
        cd build;
        cmake ..;
        make -j;
